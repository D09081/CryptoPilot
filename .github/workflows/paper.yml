name: paper-trading
on:
  schedule:
    - cron: "6 0,4,8,12,16,20 * * *"   # shortly after each H4 candle closes (UTC)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: paper-trading
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - run: python scripts/paper_run.py
      - name: Save state
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper
          git diff --cached --quiet || git commit -m "paper: update state"
          git push
